name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      # Render .env from the GitHub "production" environment; unset/empty values are skipped.
      # Before rendering, import config.py with the same values: it exits if any key in
      # REQUIRED_IN_PROD is missing or a numeric value doesn't parse, so a bad environment
      # fails here instead of taking prod down. config.py needs only the stdlib, no uv sync.
      # Shipped base64-encoded so special chars ([, ], *) survive the SSH hop untouched.
      - name: Validate and render .env
        id: dotenv
        env:
          API_ENV: production
          API_ROOT_PATH: ${{ vars.API_ROOT_PATH }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          API_IMG_BASE_URL: ${{ vars.API_IMG_BASE_URL }}
          API_PORT: ${{ vars.API_PORT }}
          API_CORS_ORIGINS: ${{ vars.API_CORS_ORIGINS }}
          DB_POSTGRES_URL: ${{ secrets.DB_POSTGRES_URL }}
          DB_PGBOUNCER_MODE: ${{ vars.DB_PGBOUNCER_MODE }}
          DB_POOL_SIZE: ${{ vars.DB_POOL_SIZE }}
          DB_MAX_OVERFLOW: ${{ vars.DB_MAX_OVERFLOW }}
          DB_POOL_RECYCLE: ${{ vars.DB_POOL_RECYCLE }}
          DB_POOL_PRE_PING: ${{ vars.DB_POOL_PRE_PING }}
          API_GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          keys=(API_ENV API_ROOT_PATH API_BASE_URL API_IMG_BASE_URL API_PORT API_CORS_ORIGINS
                DB_POSTGRES_URL DB_PGBOUNCER_MODE DB_POOL_SIZE DB_MAX_OVERFLOW DB_POOL_RECYCLE DB_POOL_PRE_PING API_GIT_SHA)
          # Unset vars arrive as empty strings; drop them so the check sees exactly what .env will hold.
          for key in "${keys[@]}"; do
            if [ -z "${!key:-}" ]; then unset "$key"; fi
          done
          python3 -c "import config"
          for key in "${keys[@]}"; do
            if [ -n "${!key:-}" ]; then
              printf '%s="%s"\n' "$key" "${!key}"
            fi
          done > .env.rendered
          b64="$(base64 -w0 .env.rendered)"
          echo "::add-mask::$b64"
          echo "b64=$b64" >> "$GITHUB_OUTPUT"
          rm .env.rendered

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        env:
          DOTENV_B64: ${{ steps.dotenv.outputs.b64 }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DOTENV_B64
          script: |
            set -e
            : "${DOTENV_B64:?rendered .env not passed to VPS, aborting before touching anything}"
            export PATH="$HOME/.local/bin:$PATH"
            cd ${{ vars.VPS_DEPLOY_PATH }}
            git fetch origin main
            git reset --hard origin/main
            umask 077
            echo "$DOTENV_B64" | base64 -d > .env.new
            mv .env.new .env
            set -a; . ./.env; set +a
            uv sync --no-dev
            uv run alembic upgrade head
            pm2 restart dog-api --update-env

  smoke-test:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: g-marcin/smoke-test-action@v1
        with:
          url: https://api.mgrzmil.dev

  # Publish only after prod is live and verified, so types never describe an API that failed to deploy.
  publish-api-types:
    needs: smoke-test
    runs-on: ubuntu-24.04
    permissions:
      id-token: write  # npm trusted publishing (OIDC); npm's trusted publisher must point at deploy.yml
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install Python deps
        run: uv sync --no-dev

      - name: Export OpenAPI spec
        run: PYTHONPATH=. uv run python scripts/export_openapi.py

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm CLI (OIDC trusted publishing requires >=11.5.1)
        run: npm install -g npm@11

      - name: Generate TypeScript types
        run: npx --yes openapi-typescript packages/api-types/openapi.json -o packages/api-types/src/api.ts

      # Skip the release when the generated spec and types match the latest published package.
      # If the package can't be fetched (first publish, registry hiccup) treat it as changed.
      - name: Compare with published package
        id: diff
        working-directory: packages/api-types
        run: |
          published="$RUNNER_TEMP/published"
          mkdir -p "$published"
          if npm pack @mgrzmil-org/api-types@latest --pack-destination "$published" --silent >/dev/null 2>&1; then
            tar xzf "$published"/*.tgz -C "$published"
            if diff -q openapi.json "$published/package/openapi.json" && diff -q src/api.ts "$published/package/src/api.ts"; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::API types unchanged since last published version, skipping publish"
              exit 0
            fi
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Sync to last published version
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/api-types
        run: |
          LAST_VERSION=$(npm view @mgrzmil-org/api-types version 2>/dev/null || echo "0.0.0")
          npm version "$LAST_VERSION" --no-git-tag-version --allow-same-version

      - name: Bump package version
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/api-types
        run: npm version patch --no-git-tag-version

      - name: Publish to npm
        if: steps.diff.outputs.changed == 'true'
        working-directory: packages/api-types
        run: npm publish
